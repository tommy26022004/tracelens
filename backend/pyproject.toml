[project]
name = "fyp-backend"
version = "0.1.0"
description = "Agentic AI backend for Malaysian SME loan document analysis"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Tran Quang Dat", email = "TP079959@mail.apu.edu.my" }]

dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Persistence
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "redis>=5.2.0",
    # Vector store
    "qdrant-client>=1.12.0",
    # Agent
    "langgraph>=0.2.50",
    "langchain-core>=0.3.21",
    "langchain-google-genai>=2.0.5",
    "google-generativeai>=0.8.3",
    # Document ingestion
    "pymupdf>=1.24.13",
    "pdfplumber>=0.11.4",
    "pytesseract>=0.3.13",
    "pillow>=11.0.0",
    # Utility
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "reportlab>=4.2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.27.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
